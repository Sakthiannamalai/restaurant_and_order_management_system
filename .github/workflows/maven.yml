name: Java CI & Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Build all modules with Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & push all microservice images
      - name: Build and push Docker images
        run: |
          services=(
            common-utils
            eureka-service
            api-gateway
            auth-service
            tenant-service
            menu-service
            table-service
            order-service
            billing-service
            kitchen-service
          )

          for service in "${services[@]}"; do
            echo "🔧 Building $service..."
            docker build -t sakthisugumar/restaurant-$service:latest ./$service
            docker push sakthisugumar/restaurant-$service:latest
          done
